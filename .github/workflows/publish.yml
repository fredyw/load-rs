name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check if version is already published
        id: check_version
        run: |
          VERSION=$(grep '^version =' Cargo.toml | cut -d '"' -f 2)
          echo "Checking if load-rs version $VERSION is already on crates.io..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://crates.io/api/v1/crates/load-rs/$VERSION)
          if [ "$STATUS" -eq 200 ]; then
            echo "Version $VERSION already exists on crates.io. Skipping publish step."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Version $VERSION not found. Proceeding with publish."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        if: steps.check_version.outputs.exists != 'true'
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    name: Release Binaries
    needs: publish
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: load-rs-linux-x86_64
            binary_name: load-rs
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: load-rs-macos-arm64
            binary_name: load-rs
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: load-rs-macos-x86_64
            binary_name: load-rs
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: load-rs-windows-x86_64.exe
            binary_name: load-rs.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      
      - name: Prepare binary
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
